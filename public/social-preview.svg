      <text x="24" y="60" fill="#132c26" font-family="Georgia, serif" font-size="48" font-weight="700">A</text>
      <path d="M45 88c-25 28-34 45-34 61 0 22 16 38 37 38 11 0 21-5 28-13-2 18-8 27-17 36h62c-9-9-15-18-17-36 7 8 17 13 28 13 21 0 37-16 37-38 0-16-9-33-34-61l-45-50z" fill="#132c26" transform="translate(14 45) scale(.84)"/>
    </g>
