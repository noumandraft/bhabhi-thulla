<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bhabhi Thulla — Bach ke nikal</title>
  <desc id="desc">Playing cards on a deep green Pakistani card table with a gold invitation to play.</desc>
  <defs>
    <pattern id="weave" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v34" stroke="#fffaf0" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#001d18" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#073f35"/>
  <rect width="1200" height="630" fill="url(#weave)"/>
  <circle cx="1078" cy="84" r="150" fill="#0d6757" opacity=".55"/>
  <circle cx="1085" cy="82" r="74" fill="#f5cf68" opacity=".96"/>
  <text x="88" y="126" fill="#fffaf0" font-family="Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1">BHABHI</text>
  <text x="88" y="168" fill="#f5cf68" font-family="Arial, sans-serif" font-size="45" font-weight="900" letter-spacing="1">THULLA</text>
  <text x="88" y="302" fill="#fffaf0" font-family="Arial, sans-serif" font-size="74" font-weight="900">Bach ke nikal.</text>
  <text x="88" y="382" fill="#f5cf68" font-family="Arial, sans-serif" font-size="74" font-weight="900">Bhabhi na banna.</text>
  <text x="92" y="452" fill="#fffaf0" fill-opacity=".74" font-family="Arial, sans-serif" font-size="27">Pakistan’s classic card game, now online with friends.</text>
