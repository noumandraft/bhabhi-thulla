services:
  - type: web
    name: bhabhi-thulla-server
    runtime: node
    plan: free
    # NODE_ENV=production makes npm omit devDependencies by default, but the
    # TypeScript compiler and declaration packages are required during build.
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://thulla.joypad.fun
      # Keep fresh Party-room creation disabled until the Party UI is released.
      - key: PARTY_MODE
        value: "off"
      - key: REDIS_KEY_PREFIX
        value: "bhabhi-thulla:room:"
      # Add REDIS_URL in the Render dashboard when shared storage is available.
      # Set this to true only for a provider that persists data across restart.
      - key: REDIS_DURABLE
        value: "false"
