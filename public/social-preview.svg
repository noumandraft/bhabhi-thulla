      <text x="24" y="60" fill="#c92f48" font-family="Georgia, serif" font-size="48" font-weight="700">K</text>
      <path d="M105 220C74 185 35 156 35 112c0-33 24-55 52-55 19 0 34 11 43 27 8-18 23-29 43-29 29 0 52 22 52 55 0 44-39 75-70 110l-25 28z" fill="#c92f48" transform="translate(-1 14)"/>
